<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ObraFácil">
<title>ObraFácil – Controle de Diárias</title>
<style>
:root{
  --azul:#0f2a4a; --azul2:#17406e; --azul3:#e8eef6;
  --laranja:#f47c20; --laranja2:#d9660d; --laranja3:#fff1e5;
  --branco:#fff; --bg:#f2f4f8; --texto:#1a2433; --cinza:#6a7586; --borda:#dde3ec;
  --verde:#1b9a59; --verde3:#e5f6ed; --vermelho:#d23f3f; --vermelho3:#fdeaea;
  --raio:14px; --sombra:0 2px 10px rgba(15,42,74,.08);
  --navh:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--texto);font-size:16px;line-height:1.4;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 12px)}
h2{font-size:1.35rem;margin:4px 0 14px;color:var(--azul)}
h3{font-size:1.05rem;margin:0 0 12px;color:var(--azul)}
small,.muted{color:var(--cinza)}
.hidden{display:none!important}
.print-only{display:none}

/* Topo */
.topbar{position:sticky;top:0;z-index:30;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:.2px}
.logo .ic{width:34px;height:34px;border-radius:9px;background:var(--laranja);display:grid;place-items:center}
.logo span b{color:var(--laranja)}
.top-actions{display:flex;gap:8px}
.top-actions button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-size:.9rem;font-weight:600;cursor:pointer;min-height:40px;display:flex;align-items:center;gap:6px}
.top-actions button.active{background:var(--laranja)}

main{max-width:1100px;margin:0 auto;padding:14px}
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Navegação inferior */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--borda);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.bottomnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--cinza);padding:6px 2px;border-radius:10px;cursor:pointer;min-height:52px}
.bottomnav button svg{width:24px;height:24px}
.bottomnav button.active{color:var(--laranja);background:var(--laranja3)}

/* Painéis e cartões */
.panel{background:#fff;border-radius:var(--raio);padding:16px;box-shadow:var(--sombra);margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.card{background:#fff;border-radius:var(--raio);padding:14px;box-shadow:var(--sombra);border-left:5px solid var(--azul2)}
.card .t{font-size:.78rem;color:var(--cinza);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.card .v{font-size:1.3rem;font-weight:800;color:var(--azul);margin-top:4px;word-break:break-word}
.card .s{font-size:.78rem;color:var(--cinza);margin-top:2px}
.card.laranja{border-left-color:var(--laranja)}
.card.verde{border-left-color:var(--verde)} .card.verde .v{color:var(--verde)}
.card.vermelho{border-left-color:var(--vermelho)} .card.vermelho .v{color:var(--vermelho)}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}

/* Botões */
.btn{border:1px solid var(--borda);background:#fff;color:var(--texto);border-radius:12px;padding:12px 16px;font-size:1rem;font-weight:600;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--laranja);border-color:var(--laranja);color:#fff}
.btn-primary:hover{background:var(--laranja2)}
.btn-azul{background:var(--azul);border-color:var(--azul);color:#fff}
.btn-danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn-sm{padding:8px 12px;min-height:40px;font-size:.88rem;border-radius:10px}
.btn-block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:180px}

/* Formulários */
label{display:block;font-size:.88rem;font-weight:600;color:var(--azul);margin-bottom:12px}
input,select,textarea{display:block;width:100%;margin-top:5px;font-size:16px;padding:12px;border:1px solid var(--borda);border-radius:11px;background:#fff;color:var(--texto);font-family:inherit;min-height:48px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--laranja);border-color:var(--laranja)}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0} input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
.check{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--texto);margin:0;cursor:pointer;min-height:44px}
.check input{width:24px;height:24px;min-height:0;margin:0;accent-color:var(--laranja);flex:none}
.hint{font-size:.82rem;color:var(--cinza);margin:-4px 0 12px;font-weight:400}
.form-erro{background:var(--vermelho3);color:var(--vermelho);border-radius:10px;padding:10px 12px;font-size:.9rem;font-weight:600;margin-bottom:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.seg input{position:absolute;opacity:0;width:0;height:0;min-height:0}
.seg label{flex:1;min-width:100px;margin:0;text-align:center;padding:12px 8px;border:1px solid var(--borda);border-radius:11px;background:#fff;cursor:pointer;font-size:.88rem;color:var(--texto)}
.seg input:checked+label{background:var(--azul);border-color:var(--azul);color:#fff}

/* Filtros */
.filtros{background:#fff;border-radius:var(--raio);padding:12px;box-shadow:var(--sombra);margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--borda);background:#fff;border-radius:999px;padding:9px 14px;font-size:.88rem;font-weight:600;cursor:pointer;min-height:40px;color:var(--texto)}
.chip.active{background:var(--azul);color:#fff;border-color:var(--azul)}
.periodo-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--azul3);border-radius:11px;padding:6px;margin-bottom:10px}
.periodo-nav b{font-size:.95rem;color:var(--azul);text-align:center;flex:1}
.periodo-nav button{border:0;background:#fff;border-radius:9px;width:44px;height:40px;font-size:1.2rem;cursor:pointer;color:var(--azul);font-weight:800}
.filtros .row2 label{margin-bottom:0}

/* Listas */
.lista{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:12px}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-top b{font-size:1rem}
.item .meta{font-size:.85rem;color:var(--cinza);margin-top:3px}
.item .acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.item.inativo{opacity:.65;background:#fafbfc}
.valor{font-weight:800;color:var(--azul);white-space:nowrap}
.valor.pos{color:var(--vermelho)} .valor.ok{color:var(--verde)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--azul3);color:var(--azul);vertical-align:middle}
.badge.laranja{background:var(--laranja3);color:var(--laranja2)}
.badge.verde{background:var(--verde3);color:var(--verde)}
.badge.vermelho{background:var(--vermelho3);color:var(--vermelho)}
.badge.cinza{background:#eceff3;color:var(--cinza)}
.vazio{text-align:center;color:var(--cinza);padding:18px 8px;font-size:.92rem}
.total-linha{display:flex;justify-content:space-between;padding:10px 4px 0;border-top:1px dashed var(--borda);margin-top:10px;font-weight:700}
.grupo-data{font-size:.8rem;font-weight:800;color:var(--cinza);text-transform:uppercase;margin:6px 2px -2px}

/* Lançamento */
.lrow{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;border:1px solid var(--borda);border-radius:12px;padding:10px;background:#fff}
.lrow.sel{border-color:var(--laranja);background:var(--laranja3)}
.lrow.ja{opacity:.6;background:#f6f7f9}
.lrow .chkbox{width:28px;height:28px;accent-color:var(--laranja);margin:0;min-height:0}
.lrow .linfo{margin:0;cursor:pointer;color:var(--texto);font-weight:400}
.lrow .linfo b{display:block;font-size:1rem}
.lrow .linfo small{font-size:.8rem}
.lrow .lctrl{grid-column:1 / -1;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.lrow .lctrl select,.lrow .lctrl input{margin:0}
.lrow .lcalc{font-weight:800;color:var(--azul);min-width:92px;text-align:right}
.lrow .lval{grid-column:1 / -1}

/* Gráficos */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:8px;align-items:center;font-size:.86rem}
.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar-track{background:var(--azul3);border-radius:8px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--azul2),var(--azul));transition:width .4s}
.bar-fill.laranja{background:linear-gradient(90deg,#ffa25a,var(--laranja))}
.bar-val{font-weight:700;color:var(--azul);white-space:nowrap;font-size:.82rem}
canvas{width:100%;display:block}

/* Tabelas */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:9px 8px;border-bottom:1px solid var(--borda);text-align:left;white-space:nowrap}
th{background:var(--azul);color:#fff;font-weight:700;font-size:.78rem;text-transform:uppercase}
td.n,th.n{text-align:right}
tfoot td{font-weight:800;background:var(--azul3)}
tbody tr:nth-child(even){background:#fafbfd}

/* Aviso, modal, toast */
.aviso{background:var(--laranja3);border:1px solid #f9c79d;color:#7a3c06;border-radius:12px;padding:12px 14px;font-size:.9rem;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.aviso button{flex:none}
#modal{position:fixed;inset:0;z-index:60;background:rgba(10,25,45,.55);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal-box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:sobe .2s ease}
@keyframes sobe{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.modal-actions{display:flex;gap:10px;margin-top:8px}
.modal-actions .btn{flex:1}
.checklist{max-height:240px;overflow-y:auto;border:1px solid var(--borda);border-radius:11px;padding:4px 10px;margin:6px 0 12px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-20px);top:calc(env(safe-area-inset-top) + 70px);z-index:80;background:var(--azul);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.erro{background:var(--vermelho)} #toast.ok{background:var(--verde)}
.rodape{font-size:.78rem;color:var(--cinza);text-align:center;margin:18px 0 6px}

@media (min-width:700px){
  .cards{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .lrow{grid-template-columns:auto minmax(160px,1fr) 2fr}
  .lrow .lctrl{grid-column:auto}
  #modal{align-items:center}
  #modal-box{border-radius:20px}
}
@media (min-width:1000px){
  body{padding-bottom:20px;padding-left:220px}
  .bottomnav{top:0;bottom:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;padding:90px 12px 12px;border-top:0;border-right:1px solid var(--borda);z-index:20}
  .bottomnav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:.95rem;padding:12px 14px;min-height:48px}
  .topbar{margin-left:-220px;padding-left:20px}
  #toast{top:80px}
}
@media print{
  @page{margin:12mm}
  body{background:#fff;padding:0!important;font-size:12px}
  .topbar,.bottomnav,.no-print,#toast,#modal,.aviso{display:none!important}
  main{padding:0;max-width:none}
  .view{display:none!important}
  #v-relatorios{display:block!important}
  .print-only{display:block!important}
  .panel,.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .cards{grid-template-columns:repeat(3,1fr)}
  .tbl-wrap{overflow:visible}
  table{font-size:10.5px}
  th{background:#0f2a4a!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  th,td{white-space:normal;padding:5px}
}

/* ===== Versão simplificada ===== */
.bottomnav button{font-size:.8rem}
.bottomnav button svg{width:27px;height:27px}
.dia-nav{display:flex;align-items:center;gap:8px;background:var(--azul);color:#fff;border-radius:var(--raio);padding:10px;margin-bottom:14px}
.dia-nav button{width:52px;height:52px;border:0;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;font-size:1.8rem;font-weight:800;cursor:pointer;flex:none}
.dia-nav button:disabled{opacity:.25}
.dia-centro{flex:1;text-align:center;margin:0;color:#fff;position:relative;cursor:pointer}
.dia-centro b{display:block;font-size:1.5rem}
.dia-centro small{color:#c9d6e8;font-size:.8rem;font-weight:400}
.dia-centro input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.passo{font-size:1.05rem;font-weight:700;color:var(--azul);margin:14px 2px 8px}
.passo small{font-weight:400;color:var(--cinza)}
.obra-chips{display:flex;flex-direction:column;gap:8px}
.ochip{border:2px solid var(--borda);background:#fff;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;text-align:left;cursor:pointer;color:var(--texto);min-height:54px}
.ochip.active{border-color:var(--laranja);background:var(--laranja3);color:var(--laranja2)}
.legenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--cinza);margin:0 2px 10px}
.c-ok{color:var(--verde)} .c-meia{color:var(--laranja2)} .c-falta{color:var(--vermelho)}
.pcard{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--borda);background:#fff;border-radius:14px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:var(--texto);min-height:72px;transition:background .15s,border-color .15s}
.pcard:active{transform:scale(.99)}
.pico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;font-weight:800;background:#eef1f5;color:var(--cinza);flex:none}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:1.05rem}
.pinfo small{color:var(--cinza);font-size:.8rem}
.pval{text-align:right;flex:none}
.pval b{display:block;font-size:.92rem}
.pval small{font-size:.8rem;color:var(--cinza);display:block}
.pval .pext{font-size:.68rem;max-width:130px}
.pcard.t-nada .pval b{color:var(--cinza);font-weight:500;font-size:.8rem}
.pcard.t-completa{border-color:var(--verde);background:var(--verde3)} .pcard.t-completa .pico{background:var(--verde);color:#fff} .pcard.t-completa .pval b{color:var(--verde)}
.pcard.t-meia{border-color:var(--laranja);background:var(--laranja3)} .pcard.t-meia .pico{background:var(--laranja);color:#fff} .pcard.t-meia .pval b{color:var(--laranja2)}
.pcard.t-falta{border-color:var(--vermelho);background:var(--vermelho3)} .pcard.t-falta .pico{background:var(--vermelho);color:#fff} .pcard.t-falta .pval b{color:var(--vermelho)}
.pcard.t-personalizado{border-color:var(--azul2);background:var(--azul3)} .pcard.t-personalizado .pico{background:var(--azul2);color:#fff;font-size:.95rem}
.pcard.salvo{border-style:dashed}
.savebar{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 8px);z-index:10;margin-top:12px;padding:6px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.btn-grande{min-height:58px;font-size:1.08rem;box-shadow:0 4px 14px rgba(244,124,32,.35)}
.btn:disabled{opacity:.5;box-shadow:none;cursor:default}
details.mais summary{cursor:pointer;font-weight:700;color:var(--azul);padding:6px 0;min-height:36px;list-style:none}
details.mais summary::-webkit-details-marker{display:none}
details.mais summary::after{content:' ▾'}
details.mais[open] summary::after{content:' ▴'}
.filtros details.mais summary{font-size:.9rem}
.abas{display:flex;gap:6px;background:#e3e8f0;border-radius:14px;padding:5px;margin-bottom:14px}
.abas button{flex:1;border:0;background:none;border-radius:10px;padding:12px;font-size:1rem;font-weight:700;color:var(--cinza);cursor:pointer;min-height:50px}
.abas button.active{background:#fff;color:var(--azul);box-shadow:var(--sombra)}
.destaque{background:var(--azul);color:#fff;border-radius:var(--raio);padding:18px;text-align:center;margin-bottom:14px}
.destaque b{display:block;font-size:2.1rem;color:#ffb27a;margin:2px 0}
.destaque small{color:#c9d6e8}
.destaque.ok b{color:#7be0a8}
.pag-item .acoes .btn{min-height:50px}
.big-cards{display:grid;gap:10px;margin-bottom:12px}
.big-card{background:#fff;border-radius:var(--raio);padding:16px;box-shadow:var(--sombra);border-left:6px solid var(--azul2)}
.big-card span{display:block;font-weight:700;color:var(--cinza);font-size:.9rem}
.big-card b{display:block;font-size:1.7rem;color:var(--azul);margin:2px 0}
.big-card small{color:var(--cinza);font-size:.8rem}
.big-card.verde{border-left-color:var(--verde)} .big-card.verde b{color:var(--verde)}
.big-card.vermelho{border-left-color:var(--vermelho)} .big-card.vermelho b{color:var(--vermelho)}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.mini-stats div{background:#fff;border-radius:12px;padding:10px 4px;text-align:center;box-shadow:var(--sombra)}
.mini-stats b{display:block;font-size:1.2rem;color:var(--azul)}
.mini-stats small{font-size:.68rem;color:var(--cinza);line-height:1.1;display:block}
@media (min-width:700px){ .big-cards{grid-template-columns:repeat(3,1fr)} }
@media print{ .savebar,.dia-nav{display:none!important} }
.ola{margin:2px 2px 14px}
.ola h2{margin:0}
.ola small{color:var(--cinza)}
.menu-grande{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.mg{border:0;border-radius:18px;padding:18px 10px;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:1.08rem;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(15,42,74,.18);text-align:center;line-height:1.15}
.mg:active{transform:scale(.97)}
.mg .e{font-size:2.4rem;line-height:1}
.mg small{font-weight:600;font-size:.8rem;color:#fff;opacity:1;background:rgba(0,0,0,.18);padding:2px 8px;border-radius:999px}
.mg.azul{background:var(--azul)} .mg.laranja{background:var(--laranja)} .mg.verde{background:var(--verde)} .mg.roxo{background:#5b4bc4} .mg.cinza{background:#2f6fb3}
.mg.largo{grid-column:1 / -1;min-height:96px;flex-direction:row;gap:14px}
.mg.azul2{background:#24507f} .mg.marrom{background:#8a5a2b}

<script>
'use strict';
/* ================== CONSTANTES E UTILITÁRIOS ================== */
const CHAVE = 'obrafacil_dados_v1';
const FUNCOES = ['Pedreiro','Servente','Pintor','Eletricista','Encanador','Ajudante','Carpinteiro','Armador','Azulejista','Gesseiro','Mestre de obras','Outro'];
const STATUS = {andamento:'Em andamento', pausada:'Pausada', concluida:'Concluída'};
const TIPOS = {completa:'Diária completa', meia:'Meia diária', falta:'Falta', personalizado:'Empreita / valor combinado'};
const CATS = {cafe:'☕ Café', almoco:'🍽️ Almoço', gasolina:'⛽ Gasolina', material:'🧱 Material', outros:'📦 Outros'};
const TIPOS_PAG = {integral:'Pagamento integral', parcial:'Pagamento parcial', adiantamento:'Adiantamento (vale)'};
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = v => Math.round((Number(v) || 0) * 100) / 100;
const fmt = v => BRL.format(r2(v));
const soma = (arr, fn) => r2(arr.reduce((s, x) => s + fn(x), 0));
const fmtNum = n => (Math.round(n * 10) / 10).toLocaleString('pt-BR');
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);

function isoDe(dt){ return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }
function paraData(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
const hoje = () => isoDe(new Date());
function dataValida(iso){ if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return false; const y = +iso.slice(0,4); if (y < 2000 || y > 2100) return false; return isoDe(paraData(iso)) === iso; }
function fmtData(iso){ if (!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; }
function fmtDataCurta(iso){ const [,m,d] = iso.split('-'); return `${d}/${m}`; }
function diaSemana(iso){ return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][paraData(iso).getDay()]; }
function addDias(iso, n){ const d = paraData(iso); d.setDate(d.getDate() + n); return isoDe(d); }
function semanaDe(iso){ const d = paraData(iso); const diff = (d.getDay() + 6) % 7; const ini = addDias(iso, -diff); return {de: ini, ate: addDias(ini, 6)}; }
function mesDe(iso){ const d = paraData(iso); return {de: isoDe(new Date(d.getFullYear(), d.getMonth(), 1)), ate: isoDe(new Date(d.getFullYear(), d.getMonth()+1, 0))}; }
function noPeriodo(iso, fx){ return (!fx.de || iso >= fx.de) && (!fx.ate || iso <= fx.ate); }

function parseValor(s){
  s = String(s ?? '').trim().replace(/R\$|\s/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return r2(parseFloat(s));
}
const valorInput = v => (v === '' || v == null) ? '' : r2(v).toFixed(2).replace('.', ',');

/* ================== DADOS ================== */
function vazio(){ return {app:'ObraFacil', versao:1, funcionarios:[], obras:[], diarias:[], pagamentos:[], despesas:[], config:{avisoVisto:false}}; }

function validar(d){
  const erro = m => ({ok:false, erro:m});
  if (!d || typeof d !== 'object' || Array.isArray(d)) return erro('O arquivo não contém um objeto de dados válido.');
  for (const k of ['funcionarios','obras','diarias','pagamentos']) if (!Array.isArray(d[k])) return erro(`Campo "${k}" ausente ou inválido.`);
  const ids = new Set();
  const novoId = id => { if (typeof id !== 'string' || !id || ids.has(id)) return false; ids.add(id); return true; };
  const fIds = new Set(), oIds = new Set();
  for (const [i,f] of d.funcionarios.entries()){
    if (!f || !novoId(f.id)) return erro(`Funcionário ${i+1}: identificador inválido ou repetido.`);
    if (typeof f.nome !== 'string' || !f.nome.trim()) return erro(`Funcionário ${i+1}: nome inválido.`);
    if (typeof f.valorDiaria !== 'number' || !isFinite(f.valorDiaria) || f.valorDiaria < 0) return erro(`Funcionário "${f.nome}": valor da diária inválido.`);
    fIds.add(f.id);
  }
  for (const [i,o] of d.obras.entries()){
    if (!o || !novoId(o.id)) return erro(`Obra ${i+1}: identificador inválido ou repetido.`);
    if (typeof o.nome !== 'string' || !o.nome.trim()) return erro(`Obra ${i+1}: nome inválido.`);
    if (o.funcionarios != null && !Array.isArray(o.funcionarios)) return erro(`Obra "${o.nome}": lista de funcionários inválida.`);
    oIds.add(o.id);
  }
  for (const [i,x] of d.diarias.entries()){
    if (!x || !novoId(x.id)) return erro(`Diária ${i+1}: identificador inválido ou repetido.`);
    if (!dataValida(x.data)) return erro(`Diária ${i+1}: data inválida.`);
    if (!fIds.has(x.funcionarioId)) return erro(`Diária ${i+1}: funcionário inexistente.`);
    if (!oIds.has(x.obraId)) return erro(`Diária ${i+1}: obra inexistente.`);
    if (!TIPOS[x.tipo]) return erro(`Diária ${i+1}: tipo inválido.`);
    if (typeof x.valor !== 'number' || !isFinite(x.valor) || x.valor < 0) return erro(`Diária ${i+1}: valor inválido.`);
  }
  for (const [i,p] of d.pagamentos.entries()){
    if (!p || !novoId(p.id)) return erro(`Pagamento ${i+1}: identificador inválido ou repetido.`);
    if (!dataValida(p.data)) return erro(`Pagamento ${i+1}: data inválida.`);
    if (!fIds.has(p.funcionarioId)) return erro(`Pagamento ${i+1}: funcionário inexistente.`);
    if (typeof p.valor !== 'number' || !isFinite(p.valor) || p.valor <= 0) return erro(`Pagamento ${i+1}: valor inválido.`);
    if (p.obraId && !oIds.has(p.obraId)) return erro(`Pagamento ${i+1}: obra inexistente.`);
  }
  if (d.despesas != null){
    if (!Array.isArray(d.despesas)) return erro('Campo "despesas" inválido.');
    for (const [i,x] of d.despesas.entries()){
      if (!x || !novoId(x.id)) return erro(`Gasto ${i+1}: identificador inválido ou repetido.`);
      if (!dataValida(x.data)) return erro(`Gasto ${i+1}: data inválida.`);
      if (typeof x.valor !== 'number' || !isFinite(x.valor) || x.valor <= 0) return erro(`Gasto ${i+1}: valor inválido.`);
      if (x.obraId && !oIds.has(x.obraId)) return erro(`Gasto ${i+1}: obra inexistente.`);
      if (x.funcionarioId && !fIds.has(x.funcionarioId)) return erro(`Gasto ${i+1}: trabalhador inexistente.`);
    }
  }
  return {ok:true};
}

function normalizar(d){
  const n = vazio();
  n.config = Object.assign(n.config, d.config || {});
  n.funcionarios = d.funcionarios.map(f => ({id:f.id, nome:String(f.nome).trim(), telefone:String(f.telefone||''), funcao:String(f.funcao||'Outro'), valorDiaria:r2(f.valorDiaria), desloc:r2(f.desloc || 0), alim:r2(f.alim || 0), ativo:f.ativo !== false, criadoEm:f.criadoEm || hoje()}));
  n.obras = d.obras.map(o => ({id:o.id, nome:String(o.nome).trim(), endereco:String(o.endereco||''), cliente:String(o.cliente||''), status:STATUS[o.status] ? o.status : 'andamento', arquivada:!!o.arquivada, funcionarios:(o.funcionarios||[]).filter(id => d.funcionarios.some(f => f.id === id)), criadoEm:o.criadoEm || hoje()}));
  n.diarias = d.diarias.map(x => ({id:x.id, data:x.data, obraId:x.obraId, funcionarioId:x.funcionarioId, tipo:x.tipo, valorBase:r2(x.valorBase ?? x.valor), valorDia:r2(x.valorDia ?? x.valor), desloc:r2(x.desloc || 0), alim:r2(x.alim || 0), extra:r2(x.extra || 0), valor:r2(x.valor), obs:String(x.obs||''), nomeFunc:String(x.nomeFunc||''), nomeObra:String(x.nomeObra||''), criadoEm:x.criadoEm || new Date().toISOString()}));
  n.despesas = (d.despesas || []).map(x => ({id:x.id, data:x.data, categoria:CATS[x.categoria] ? x.categoria : 'outros', valor:r2(x.valor), obraId:x.obraId || '', funcionarioId:x.funcionarioId || '', obs:String(x.obs||''), criadoEm:x.criadoEm || new Date().toISOString()}));
  n.despesas.forEach(x => { if (!x.funcionarioId){ const m = /– (.+)$/.exec(x.obs); const f = m && n.funcionarios.find(f => f.nome === m[1].trim()); if (f) x.funcionarioId = f.id; } });
  // Migração: deslocamento/alimentação saem da diária do trabalhador e viram gastos da ADM
  n.diarias.forEach(x => {
    const add = (v, cat, rot) => { if (v > 0) n.despesas.push({id:uid(), data:x.data, categoria:cat, valor:v, obraId:x.obraId, funcionarioId:x.funcionarioId, obs:rot + ' – ' + (x.nomeFunc || ''), criadoEm:new Date().toISOString()}); };
    add(x.desloc, 'gasolina', 'Deslocamento'); add(x.alim, 'almoco', 'Alimentação');
    if (x.desloc || x.alim){ x.desloc = 0; x.alim = 0; x.valor = r2(x.valorDia + x.extra); }
  });
  n.funcionarios.forEach(f => { f.desloc = 0; f.alim = 0; });
  n.pagamentos = d.pagamentos.map(p => ({id:p.id, data:p.data, funcionarioId:p.funcionarioId, obraId:p.obraId || '', tipo:TIPOS_PAG[p.tipo] ? p.tipo : 'parcial', valor:r2(p.valor), obs:String(p.obs||''), nomeFunc:String(p.nomeFunc||''), criadoEm:p.criadoEm || new Date().toISOString()}));
  return n;
}

function carregar(){
  try {
    const s = localStorage.getItem(CHAVE);
    if (s){ const d = JSON.parse(s); if (validar(d).ok) return normalizar(d); }
  } catch(e){ console.error(e); }
  return null;
}
function salvar(){
  try { localStorage.setItem(CHAVE, JSON.stringify(db)); return true; }
  catch(e){ toast('Erro ao salvar no navegador! Exporte um backup.', 'erro'); console.error(e); return false; }
}

function gerarDemo(){
  const d = vazio();
  const fs = [
    ['Pedro Fictício','(11) 90000-0001','Pedreiro',180],
    ['Marcos Exemplo','(11) 90000-0002','Servente',120],
    ['Luiz Demonstração','(11) 90000-0003','Pintor',160],
    ['Rafael Modelo','(11) 90000-0004','Eletricista',200],
    ['André Teste','(11) 90000-0005','Encanador',190],
    ['Bruno Amostra','(11) 90000-0006','Ajudante',100]
  ];
  fs.forEach(([nome,telefone,funcao,valorDiaria], i) => d.funcionarios.push({id:uid(), nome, telefone, funcao, valorDiaria, ativo:true, criadoEm:addDias(hoje(),-30)}));
  const F = d.funcionarios.map(f => f.id);
  d.obras = [
    {id:uid(), nome:'Residência Jardim Exemplo', endereco:'Rua Fictícia, 100 – Bairro Demo', cliente:'Cliente Demo A', status:'andamento', arquivada:false, funcionarios:[F[0],F[1],F[2]], criadoEm:addDias(hoje(),-30)},
    {id:uid(), nome:'Reforma Comercial Centro', endereco:'Av. Modelo, 2000 – Centro Demo', cliente:'Cliente Demo B', status:'andamento', arquivada:false, funcionarios:[F[0],F[3],F[4],F[5]], criadoEm:addDias(hoje(),-30)},
    {id:uid(), nome:'Muro e Calçada Vila Teste', endereco:'Travessa Amostra, 45', cliente:'Cliente Demo C', status:'pausada', arquivada:false, funcionarios:[F[1],F[5]], criadoEm:addDias(hoje(),-30)}
  ];
  let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let i = 24; i >= 0; i--){
    const data = addDias(hoje(), -i);
    const wd = paraData(data).getDay();
    if (wd === 0) continue;
    d.obras.forEach((o, oi) => {
      if (o.status === 'pausada' && i < 8) return;
      if (wd === 6 && oi > 0) return;
      o.funcionarios.forEach(fid => {
        if (fid === F[0] && (i % 2) !== oi) return;
        if (fid === F[5] && oi === 2 && i % 2) return;
        if (fid === F[5] && oi === 1 && !(i % 2) && o.status !== 'pausada' && i >= 8) return;
        if (fid === F[1] && oi === 2 && i % 3) return;
        if (fid === F[1] && oi === 0 && !(i % 3) && i >= 8) return;
        const f = d.funcionarios.find(x => x.id === fid);
        const r = rnd();
        const tipo = wd === 6 ? 'meia' : r < 0.07 ? 'falta' : r < 0.16 ? 'meia' : 'completa';
        d.diarias.push(novaDiaria(f, o, data, tipo));
      });
    });
  }
  const corte = addDias(hoje(), -9);
  d.funcionarios.forEach((f, i) => {
    const dev = soma(d.diarias.filter(x => x.funcionarioId === f.id && x.data <= corte), x => x.valor);
    if (dev > 0){
      const tipo = i === 2 ? 'parcial' : 'integral';
      const valor = tipo === 'integral' ? dev : r2(Math.floor(dev * 0.6 / 10) * 10);
      if (valor > 0) d.pagamentos.push({id:uid(), data:addDias(hoje(),-9), funcionarioId:f.id, obraId:'', tipo, valor, obs:'Acerto semanal (demonstração)', nomeFunc:f.nome, criadoEm:new Date().toISOString()});
    }
  });
  d.pagamentos.push({id:uid(), data:addDias(hoje(),-3), funcionarioId:F[1], obraId:d.obras[0].id, tipo:'adiantamento', valor:50, obs:'Vale para transporte (demonstração)', nomeFunc:'Marcos Exemplo', criadoEm:new Date().toISOString()});
  for (let i = 20; i >= 0; i--){
    const data = addDias(hoje(), -i); if (paraData(data).getDay() === 0) continue;
    d.obras[i % 2].funcionarios.slice(0, 2).forEach(fid => d.despesas.push({id:uid(), data, categoria:'almoco', valor:18, obraId:d.obras[i % 2].id, funcionarioId:fid, obs:'(demo)', criadoEm:new Date().toISOString()}));
    if (i % 2 === 0) d.despesas.push({id:uid(), data, categoria:'gasolina', valor:60, obraId:d.obras[i % 2].id, obs:'Abastecimento (demo)', criadoEm:new Date().toISOString()});
    if (i % 3 === 0) d.despesas.push({id:uid(), data, categoria:'cafe', valor:8, obraId:'', funcionarioId:d.funcionarios[1].id, obs:'(demo)', criadoEm:new Date().toISOString()});
  }
  return d;
}

let db = carregar();
// Começa zerado. Se o aparelho só tiver os dados de demonstração antigos, limpa automaticamente.
const NOMES_DEMO = ['Pedro Fictício','Marcos Exemplo','Luiz Demonstração','Rafael Modelo','André Teste','Bruno Amostra'];
const soDemo = d => d && d.funcionarios.length > 0 && d.funcionarios.every(f => NOMES_DEMO.includes(f.nome)) && !d.config.demoManual;
if (!db || soDemo(db)){ db = vazio(); }
salvar();

/* ================== REGRAS DE NEGÓCIO ================== */
const func = id => db.funcionarios.find(f => f.id === id);
const obra = id => db.obras.find(o => o.id === id);
const nomeF = (id, snap) => func(id)?.nome || snap || '(funcionário removido)';
const nomeO = (id, snap) => obra(id)?.nome || snap || '(obra removida)';
function novaDiaria(f, o, data, tipo){
  const valorDia = calcValor(tipo, f.valorDiaria);
  return {id:uid(), data, obraId:o.id, funcionarioId:f.id, tipo, valorBase:f.valorDiaria, valorDia, desloc:0, alim:0, extra:0, valor:valorDia, obs:'', nomeFunc:f.nome, nomeObra:o.nome, criadoEm:new Date().toISOString()};
}
const extrasTxt = d => d.extra ? 'acréscimo ' + fmt(d.extra) : '';
function calcValor(tipo, base, custom){
  if (tipo === 'completa') return r2(base);
  if (tipo === 'meia') return r2(base / 2);
  if (tipo === 'falta') return 0;
  return r2(custom);
}
const equiv = t => t === 'completa' ? 1 : t === 'meia' ? 0.5 : t === 'personalizado' ? 1 : 0;
function saldoFunc(id, excluirPag){
  const devido = soma(db.diarias.filter(d => d.funcionarioId === id), d => d.valor);
  const pago = soma(db.pagamentos.filter(p => p.funcionarioId === id && p.id !== excluirPag), p => p.valor);
  return {devido, pago, saldo: r2(devido - pago)};
}
function duplicada(fid, oid, data, excluir){ return db.diarias.some(d => d.funcionarioId === fid && d.obraId === oid && d.data === data && d.id !== excluir); }
const obrasDoFunc = fid => db.obras.filter(o => o.funcionarios.includes(fid));

/* ================== ESTADO DA INTERFACE ================== */
const filtroBase = () => ({periodo:'mes', ref:hoje(), de:'', ate:'', obra:'', func:''});
const st = {
  view:'dashboard',
  dash: filtroBase(), rel: filtroBase(),
  lanc: {data:hoje(), obra:'', marks:{}}, equipeAba:'func', adm: {...filtroBase(), periodo:'mes'},
  histD: {func:'', obra:'', de:'', ate:'', limite:60},
  fBusca:'', fInativos:false, oArq:false,
  pg: {func:''}, histP: {func:'', limite:60}
};

function faixa(f){
  if (f.periodo === 'semana'){ const s = semanaDe(f.ref); return {...s, label:`Semana ${fmtDataCurta(s.de)} a ${fmtData(s.ate)}`}; }
  if (f.periodo === 'mes'){ const m = mesDe(f.ref); const d = paraData(f.ref); return {...m, label:`${MESES[d.getMonth()]} de ${d.getFullYear()}`}; }
  if (f.periodo === 'personalizado') return {de:f.de, ate:f.ate, label: (f.de || f.ate) ? `${f.de ? fmtData(f.de) : 'início'} a ${f.ate ? fmtData(f.ate) : 'hoje'}` : 'Escolha as datas'};
  return {de:'', ate:'', label:'Todo o período'};
}
function moverPeriodo(f, dir){
  if (f.periodo === 'semana') f.ref = addDias(f.ref, 7 * dir);
  else if (f.periodo === 'mes'){ const d = paraData(f.ref); f.ref = isoDe(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
}

function toast(msg, tipo = ''){

}
let modalResolve = null;
function abrirModal(html){ $('#modal-box').innerHTML = html; $('#modal').classList.add('open'); document.body.style.overflow = 'hidden'; const first = $('#modal-box input:not([type=hidden]):not([type=checkbox]):not([type=radio]), #modal-box select'); if (first && window.innerWidth > 700) first.focus(); }
function fecharModal(res = false){ $('#modal').classList.remove('open'); document.body.style.overflow = ''; $('#modal-box').innerHTML = ''; if (modalResolve){ const r = modalResolve; modalResolve = null; r(res); } }
function confirmar(msg, {ok = 'Confirmar', perigo = false, titulo = 'Confirmação'} = {}){

    if (modalResolve) { modalResolve(false); }
    abrirModal(`<h3>${esc(titulo)}</h3><p>${msg}</p><div class="modal-actions"><button class="btn" data-m="nao">Cancelar</button><button class="btn ${perigo ? 'btn-danger' : 'btn-primary'}" data-m="sim">${esc(ok)}</button></div>`);

}

function filtrosHTML(k, f){

function barras(items, cor = ''){
  items = items.filter(i => i.valor > 0).sort((a,b) => b.valor - a.valor);
  if (!items.length) return '<p class="vazio">Sem lançamentos no período.</p>';
  const max = items[0].valor;
  return '<div class="bars">' + items.map(i => `<div class="bar-row"><div class="bar-label" title="${esc(i.label)}">${esc(i.label)}</div><div class="bar-track"><div class="bar-fill ${cor}" style="width:${Math.max(3, i.valor / max * 100).toFixed(1)}%"></div></div><div class="bar-val">${fmt(i.valor)}</div></div>`).join('') + '</div>';
}
function badgeTipo(t){ const c = {completa:'verde', meia:'laranja', falta:'vermelho', personalizado:''}[t]; return `<span class="badge ${c}">${TIPOS[t]}</span>`; }
function badgePag(t){ const c = {integral:'verde', parcial:'', adiantamento:'laranja'}[t]; return `<span class="badge ${c}">${TIPOS_PAG[t]}</span>`; }
function badgeStatus(o){ if (o.arquivada) return '<span class="badge cinza">Arquivada</span>'; const c = {andamento:'verde', pausada:'laranja', concluida:''}[o.status]; return `<span class="badge ${c}">${STATUS[o.status]}</span>`; }

function filtrarDados(f){
  const fx = faixa(f);
  const ds = db.diarias.filter(d => noPeriodo(d.data, fx) && (!f.obra || d.obraId === f.obra) && (!f.func || d.funcionarioId === f.func));
  const ps = db.pagamentos.filter(p => noPeriodo(p.data, fx) && (!f.obra || p.obraId === f.obra) && (!f.func || p.funcionarioId === f.func));
  return {fx, ds, ps};
}

      <div class="panel"><h3>Quanto cada obra gastou</h3>${barras(Object.entries(porO).map(([id, v]) => ({label:nomeO(id), valor:r2(v)})), 'laranja')}</div>
    </div>
    <div class="panel"><h3>Gasto por dia</h3><canvas id="graf-dias" height="180"></canvas></div>
    <button class="btn btn-azul btn-block" data-nav="relatorios" style="margin-bottom:10px">📄 Relatório completo (PDF / Excel)</button>
    <button class="btn btn-block" data-nav="config">💾 Backup dos dados</button>
    <p class="rodape">⚠️ Os dados ficam só neste aparelho. Faça backup toda semana.</p>`;
  desenharLinha($('#graf-dias'), ds, fx);
}
function desenharLinha(cv, ds, fx){
  if (!cv) return;
  const porDia = {};
  ds.forEach(d => porDia[d.data] = (porDia[d.data] || 0) + d.valor);
  let datas = Object.keys(porDia).sort();
  if (fx.de && fx.ate && fx.de <= fx.ate){
    const lista = []; let x = fx.de; let n = 0;
    while (x <= fx.ate && n < 400){ lista.push(x); x = addDias(x, 1); n++; }
    if (lista.length <= 62) datas = lista;
  }
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 300, h = 180;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
  const c = cv.getContext('2d'); c.scale(dpr, dpr); c.clearRect(0, 0, w, h);
  c.font = '11px -apple-system, Segoe UI, Roboto, sans-serif';
  if (!datas.length){ c.fillStyle = '#6a7586'; c.textAlign = 'center'; c.fillText('Sem lançamentos no período.', w/2, h/2); return; }
  const vals = datas.map(d => porDia[d] || 0);
  const max = Math.max(...vals, 1);
  const pl = 8, pr = 8, pt = 22, pb = 24;
  const bw = (w - pl - pr) / datas.length;
  c.strokeStyle = '#e8eef6'; c.lineWidth = 1;
  for (let i = 0; i <= 3; i++){ const y = pt + (h - pt - pb) * i / 3; c.beginPath(); c.moveTo(pl, y); c.lineTo(w - pr, y); c.stroke(); }
  vals.forEach((v, i) => {
    const bh = (h - pt - pb) * v / max;
    const x = pl + i * bw + bw * 0.15, y = h - pb - bh;
    c.fillStyle = v === max ? '#f47c20' : '#17406e';
    c.fillRect(x, y, Math.max(1, bw * 0.7), bh);
  });
  c.fillStyle = '#6a7586'; c.textAlign = 'center';
  const passo = Math.ceil(datas.length / Math.max(1, Math.floor(w / 46)));
  datas.forEach((d, i) => { if (i % passo === 0) c.fillText(fmtDataCurta(d), pl + i * bw + bw / 2, h - 7); });
  c.textAlign = 'left'; c.fillStyle = '#0f2a4a'; c.fillText('Máx. no dia: ' + fmt(max), pl, 12);
}

/* ================== DIÁRIAS ================== */
function rotuloDia(iso){ if (iso === hoje()) return 'Hoje'; if (iso === addDias(hoje(), -1)) return 'Ontem'; return diaSemana(iso); }
const CICLO = ['', 'completa', 'meia', 'falta'];
const ICONE = {'':'○', completa:'✓', meia:'½', falta:'✗', personalizado:'R$'};
const ROTULO = {'':'Toque para marcar', completa:'Trabalhou', meia:'Meio dia', falta:'Faltou', personalizado:'Empreita'};
function funcsDoDia(){
  const o = obra(st.lanc.obra);
  const eq = o ? o.funcionarios : [];
  return db.funcionarios.filter(f => f.ativo).sort((a,b) => (eq.includes(b.id) - eq.includes(a.id)) || a.nome.localeCompare(b.nome, 'pt-BR'));
}
function cardPessoa(f){
  const ja = db.diarias.find(d => d.funcionarioId === f.id && d.obraId === st.lanc.obra && d.data === st.lanc.data);

  const tipo = ja ? ja.tipo : (st.lanc.marks[f.id] || '');

  const valor = prev ? prev.valor : 0;
  return `<button class="pcard t-${tipo || 'nada'} ${ja ? 'salvo' : ''}" data-act="${ja ? 'editarDiaria' : 'marcar'}" data-id="${ja ? ja.id : ''}" data-fid="${f.id}">
    <span class="pico">${ICONE[tipo]}</span>
    <span class="pinfo"><b>${esc(f.nome)}</b><small>${esc(f.funcao)} · ${fmt(f.valorDiaria)}/dia${outra ? ` · já marcado em ${esc(nomeO(outra.obraId))}` : ''}</small></span>
    <span class="pval"><b>${ROTULO[tipo]}</b>${tipo ? `<small>${ja ? '💾 salvo · ' : ''}${fmt(valor)}</small>` : ''}${prev && extrasTxt(prev) ? `<small class="pext">inclui ${extrasTxt(prev)}</small>` : ''}</span>
  </button>`;
}
function renderDiarias(){
  const obrasDisp = db.obras.filter(o => !o.arquivada);

function atualizarBotaoLancar(){
  const b = $('#btn-lancar'); if (!b) return;

function renderHistDiarias(){
  const h = st.histD, box = $('#hist-d'); if (!box) return;
  const lista = db.diarias.filter(d => (!h.func || d.funcionarioId === h.func) && (!h.obra || d.obraId === h.obra) && (!h.de || d.data >= h.de) && (!h.ate || d.data <= h.ate))
    .sort((a,b) => b.data.localeCompare(a.data) || nomeF(a.funcionarioId).localeCompare(nomeF(b.funcionarioId), 'pt-BR'));

    html += `<div class="item"><div class="item-top"><div><b>${esc(nomeF(d.funcionarioId, d.nomeFunc))}</b><div class="meta">${esc(nomeO(d.obraId, d.nomeObra))}</div></div><div class="valor">${fmt(d.valor)}</div></div>

  });
  html += '</div>';
  if (lista.length > mostra.length) html += `<button class="btn btn-block" style="margin-top:10px" data-act="maisDiarias">Mostrar mais (${lista.length - mostra.length} restantes)</button>`;
  html += `<div class="total-linha"><span>${lista.length} registro(s)</span><span>${fmt(soma(lista, d => d.valor))}</span></div>`;
  box.innerHTML = html;
}
function lancarDiarias(){
  const data = st.lanc.data, obraId = st.lanc.obra, o = obra(obraId);
  if (!dataValida(data) || data > hoje()) return toast('Data inválida.', 'erro');
  if (!o) return toast('Escolha a obra.', 'erro');
  const ids = Object.keys(st.lanc.marks).filter(id => st.lanc.marks[id] && func(id));
  if (!ids.length) return toast('Toque no nome de quem trabalhou.', 'erro');
  const novos = []; let dup = 0;
  ids.forEach(id => {
    const f = func(id), tipo = st.lanc.marks[id];
    if (duplicada(id, obraId, data)){ dup++; return; }
    novos.push(novaDiaria(f, o, data, tipo));
  });
  st.lanc.marks = {};
  if (!novos.length){ renderDiarias(); return toast('Esses já estavam salvos neste dia.', 'erro'); }
  db.diarias.push(...novos); salvar();
  toast(`✅ Salvo! ${novos.length} marcação(ões) · ${fmt(soma(novos, d => d.valor))}` + (dup ? ` (${dup} já existia)` : ''), 'ok');
  renderDiarias();
}

function infoAcerto(fid){
  const pags = db.pagamentos.filter(p => p.funcionarioId === fid);
  const ultimo = pags.filter(p => p.tipo === 'integral').sort((a,b) => b.data.localeCompare(a.data) || b.criadoEm.localeCompare(a.criadoEm))[0];
  const corte = ultimo ? ultimo.data : '';
  const ds = db.diarias.filter(d => d.funcionarioId === fid);
  const antes = r2(soma(ds.filter(d => corte && d.data <= corte), d => d.valor) - soma(pags.filter(p => corte && p.data <= corte), p => p.valor));
  const dsN = ds.filter(d => !corte || d.data > corte), psN = pags.filter(p => !corte || p.data > corte);
  return {corte, antes, dias:dsN.reduce((s, d) => s + equiv(d.tipo), 0), faltas:dsN.filter(d => d.tipo === 'falta').length,
    ganhou:soma(dsN, d => d.valorDia), desloc:soma(dsN, d => d.desloc), alim:soma(dsN, d => d.alim), extra:soma(dsN, d => d.extra), vales:soma(psN.filter(p => p.tipo === 'adiantamento'), p => p.valor), pagos:soma(psN.filter(p => p.tipo !== 'adiantamento'), p => p.valor), saldo:saldoFunc(fid).saldo};
}

function validarPagamento(form, {fid, tipo, data, valor, obraId, excluir}){
  if (!func(fid)) return erroForm(form, 'Selecione o funcionário.');
  if (!TIPOS_PAG[tipo]) return erroForm(form, 'Selecione o tipo de pagamento.');
  if (!dataValida(data)) return erroForm(form, 'Informe uma data válida.');
  if (data > hoje()) return erroForm(form, 'A data do pagamento não pode ser futura.');
  if (obraId && !obra(obraId)) return erroForm(form, 'Obra inválida.');
  const s = saldoFunc(fid, excluir);
  if (tipo === 'integral' && s.saldo <= 0) return erroForm(form, 'Não há saldo devido para pagamento integral. Use "Adiantamento (vale)".');
  if (!(valor > 0)) return erroForm(form, 'Informe um valor maior que zero (ex.: 150,00).');
  if (valor > 1000000) return erroForm(form, 'Valor muito alto. Confira o número digitado.');
  if (tipo !== 'adiantamento' && valor > s.saldo + 0.004) return erroForm(form, `Valor maior do que ele tem a receber (${fmt(Math.max(0, s.saldo))}). Se for pagar antes, use "Vale".`);
  return true;
}

function dadosRelatorio(){
  const f = st.rel;
  const {fx, ds, ps} = filtrarDados(f);
  const ids = new Set([...ds.map(d => d.funcionarioId), ...ps.map(p => p.funcionarioId)]);
  const porFunc = [...ids].map(id => {
    const fd = ds.filter(d => d.funcionarioId === id), fp = ps.filter(p => p.funcionarioId === id);
    const devido = soma(fd, d => d.valor), pago = soma(fp, p => p.valor);
    return {id, nome:nomeF(id, fd[0]?.nomeFunc || fp[0]?.nomeFunc), funcao:func(id)?.funcao || '', dias:fd.reduce((s, d) => s + equiv(d.tipo), 0), faltas:fd.filter(d => d.tipo === 'falta').length, devido, pago, saldo:r2(devido - pago), saldoGeral:saldoFunc(id).saldo};
  }).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const oids = [...new Set(ds.map(d => d.obraId))];
  const porObra = oids.map(id => { const od = ds.filter(d => d.obraId === id); const o = obra(id);
    return {nome:nomeO(id, od[0]?.nomeObra), cliente:o?.cliente || '', status:o ? (o.arquivada ? 'Arquivada' : STATUS[o.status]) : '', diasHomem:od.reduce((s, d) => s + equiv(d.tipo), 0), funcs:new Set(od.map(d => d.funcionarioId)).size, valor:soma(od, d => d.valor)};
  }).sort((a,b) => b.valor - a.valor);
  const semanas = {};
  ds.forEach(d => { const w = semanaDe(d.data).de; (semanas[w] = semanas[w] || {de:w, dias:0, devido:0, pago:0}); semanas[w].dias += equiv(d.tipo); semanas[w].devido += d.valor; });
  ps.forEach(p => { const w = semanaDe(p.data).de; (semanas[w] = semanas[w] || {de:w, dias:0, devido:0, pago:0}); semanas[w].pago += p.valor; });
  const gs = db.despesas.filter(g => noPeriodo(g.data, fx) && (!f.obra || g.obraId === f.obra) && (!f.func || g.funcionarioId === f.func)).sort((a,b) => a.data.localeCompare(b.data));
  const porSemana = Object.values(semanas).sort((a,b) => a.de.localeCompare(b.de));
  return {fx, ds:ds.slice().sort((a,b) => a.data.localeCompare(b.data) || nomeF(a.funcionarioId).localeCompare(nomeF(b.funcionarioId), 'pt-BR')), ps:ps.slice().sort((a,b) => a.data.localeCompare(b.data)), porFunc, porObra, porSemana,
    gs, tot:{gastos:soma(gs, g => g.valor), devido:soma(ds, d => d.valor), pago:soma(ps, p => p.valor), dias:ds.reduce((s, d) => s + equiv(d.tipo), 0), faltas:ds.filter(d => d.tipo === 'falta').length}};
}

      </tbody><tfoot><tr><td colspan="4">Total</td><td class="n">${fmt(r.tot.pago)}</td><td></td></tr></tfoot></table></div>` : '<p class="vazio">Sem pagamentos no período.</p>'}</div>`;
}
function csv(linhas){
  const cel = c => { if (typeof c === 'number') c = r2(c).toFixed(2).replace('.', ','); c = String(c ?? ''); return '"' + c.replace(/"/g, '""') + '"'; };
  return '﻿' + linhas.map(l => l.map(cel).join(';')).join('\r\n');
}
function baixar(nome, conteudo, tipo){
  try {
    const blob = new Blob([conteudo], {type:tipo});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = nome; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('📁 Arquivo gerado: ' + nome, 'ok');
  } catch(e){ toast('Não foi possível gerar o arquivo neste navegador.', 'erro'); }
}

const forms = {
  funcionario: fm => {
    const E = fm.elements, id = E.id.value;
    const nome = E.nome.value.trim().replace(/\s+/g, ' '), tel = E.telefone.value.trim(), funcao = E.funcao.value, valor = parseValor(E.valor.value);
    if (nome.length < 2) return erroForm(fm, 'Informe o nome do funcionário (mínimo 2 letras).');
    if (db.funcionarios.some(f => f.id !== id && f.nome.toLowerCase() === nome.toLowerCase())) return erroForm(fm, 'Já existe um funcionário com esse nome.');
    const dig = tel.replace(/\D/g, '');
    if (tel && (dig.length < 10 || dig.length > 11)) return erroForm(fm, 'Telefone inválido. Use DDD + número, ex.: (11) 91234-5678.');
    if (!funcao) return erroForm(fm, 'Selecione a função.');
    if (!(valor > 0)) return erroForm(fm, 'Informe o valor da diária (ex.: 150,00).');
    if (valor > 100000) return erroForm(fm, 'Valor da diária muito alto. Confira.');
    const desloc = 0, alim = 0;
    if (id){ const f = func(id); Object.assign(f, {nome, telefone:tel, funcao, valorDiaria:valor, desloc, alim}); toast('Trabalhador atualizado.', 'ok'); }
    else { db.funcionarios.push({id:uid(), nome, telefone:tel, funcao, valorDiaria:valor, desloc, alim, ativo:true, criadoEm:hoje()}); toast('Trabalhador cadastrado.', 'ok'); }
    salvar(); fecharModal(true); atualizar();
  },
  obra: fm => {
    const E = fm.elements, id = E.id.value;
    const nome = E.nome.value.trim().replace(/\s+/g, ' ');
    if (nome.length < 2) return erroForm(fm, 'Informe o nome da obra.');
    if (db.obras.some(o => o.id !== id && o.nome.toLowerCase() === nome.toLowerCase())) return erroForm(fm, 'Já existe uma obra com esse nome.');
    if (!STATUS[E.status.value]) return erroForm(fm, 'Selecione o status.');
    const equipe = $$('input[name=equipe]:checked', fm).map(c => c.value).filter(fid => func(fid));
    const dados = {nome, endereco:E.endereco.value.trim(), cliente:E.cliente.value.trim(), status:E.status.value, funcionarios:equipe};
    if (id){ Object.assign(obra(id), dados); toast('Obra atualizada.', 'ok'); }
    else { db.obras.push({id:uid(), ...dados, arquivada:false, criadoEm:hoje()}); toast('Obra cadastrada.', 'ok'); }
    salvar(); fecharModal(true); atualizar();
  },
  diaria: fm => {
    const E = fm.elements, d = db.diarias.find(x => x.id === E.id.value); if (!d) return fecharModal();
    const data = E.data.value, obraId = E.obra.value, tipo = E.tipo.value;
    if (!dataValida(data)) return erroForm(fm, 'Informe uma data válida.');
    if (data > hoje()) return erroForm(fm, 'A data não pode ser futura.');
    if (!obra(obraId)) return erroForm(fm, 'Selecione a obra.');
    if (!TIPOS[tipo]) return erroForm(fm, 'Selecione o tipo.');
    let valorDia = calcValor(tipo, d.valorBase);
    if (tipo === 'personalizado'){ valorDia = parseValor(E.valor.value); if (!(valorDia > 0) || valorDia > 100000) return erroForm(fm, 'Informe o valor da empreita (ex.: 500,00).'); }
    const ex = {};
    ex.desloc = 0; ex.alim = 0;
    for (const [k, nome] of [['extra','Acréscimo']]){
      const t = E[k].value.trim(); ex[k] = t ? parseValor(t) : 0;
      if (isNaN(ex[k]) || ex[k] < 0 || ex[k] > 100000) return erroForm(fm, nome + ': valor inválido (ex.: 15,00).');
    }
    const valor = r2(valorDia + ex.desloc + ex.alim + ex.extra);
    if (duplicada(d.funcionarioId, obraId, data, d.id)) return erroForm(fm, 'Já existe lançamento deste funcionário nesta obra e data.');
    Object.assign(d, {data, obraId, tipo, valorDia, ...ex, valor, obs:E.obs.value.trim(), nomeObra:obra(obraId).nome});
    salvar(); fecharModal(true); toast('Diária atualizada.', 'ok'); atualizar();
  },
  gasto: fm => {
    const E = fm.elements, id = E.id.value, cat = E.categoria.value, valor = parseValor(E.valor.value), data = E.data.value, obraId = E.obra.value;
    if (!CATS[cat]) return erroForm(fm, 'Escolha o tipo do gasto.');
    if (!(valor > 0) || valor > 1000000) return erroForm(fm, 'Informe o valor (ex.: 15,00).');
    if (!dataValida(data) || data > hoje()) return erroForm(fm, 'Informe uma data válida até hoje.');
    if (obraId && !obra(obraId)) return erroForm(fm, 'Obra inválida.');
    const obs = E.obs.value.trim();
    if (id){
      const pessoa = E.pessoa.value; if (pessoa && !func(pessoa)) return erroForm(fm, 'Trabalhador inválido.');
      Object.assign(db.despesas.find(x => x.id === id), {categoria:cat, valor, data, obraId, funcionarioId:pessoa, obs});
      salvar(); fecharModal(true); toast('Gasto atualizado.', 'ok'); return atualizar();
    }
    const quem = $$('input[name=quem]:checked', fm).map(c => c.value).filter(x => func(x));
    const lista = quem.length ? quem : [''];
    lista.forEach(fid => db.despesas.push({id:uid(), categoria:cat, valor, data, obraId, funcionarioId:fid, obs, criadoEm:new Date().toISOString()}));
    salvar(); fecharModal(true);
    toast(`✅ ${CATS[cat]}: ${fmt(valor * lista.length)} salvo${quem.length > 1 ? ` (${quem.length} pessoas)` : quem.length ? ' para ' + nomeF(quem[0]) : ''}.`, 'ok'); atualizar();
  },
  variosDias: async fm => {
    const E = fm.elements, quem = $$('input[name=quem]:checked', fm).map(c => c.value).filter(id => func(id));
    const o = obra(E.obra.value), de = E.de.value, ate = E.ate.value, tipo = E.tipo.value;
    if (!quem.length) return erroForm(fm, 'Marque pelo menos um trabalhador.');
    if (!o) return erroForm(fm, 'Escolha a obra.');
    if (!dataValida(de) || !dataValida(ate)) return erroForm(fm, 'Informe as duas datas.');
    if (de > ate) return erroForm(fm, 'A data inicial é depois da final.');
    if (ate > hoje()) return erroForm(fm, 'Não dá para lançar dias no futuro.');
    const dias = []; for (let x = de; x <= ate; x = addDias(x, 1)){ const w = paraData(x).getDay(); if ((w === 0 && E.semDom.checked) || (w === 6 && E.semSab.checked)) continue; dias.push(x); if (dias.length > 62) break; }
    if (dias.length > 62) return erroForm(fm, 'Período muito longo (máximo de 62 dias).');
    if (!dias.length) return erroForm(fm, 'Nenhum dia no período escolhido.');
    const novos = []; let dup = 0;
    quem.forEach(fid => dias.forEach(dt => { if (duplicada(fid, o.id, dt)) dup++; else novos.push(novaDiaria(func(fid), o, dt, tipo)); }));
    if (!novos.length) return erroForm(fm, 'Todos esses dias já estavam marcados.');
    const nomes = quem.map(id => esc(func(id).nome)).join(', ');
    if (!await confirmar(`Lançar <b>${novos.length} diária(s)</b> para ${nomes} na obra <b>${esc(o.nome)}</b>, de ${fmtData(de)} a ${fmtData(ate)}?<br><br>Total: <b>${fmt(soma(novos, d => d.valor))}</b>${dup ? `<br><small>${dup} dia(s) já marcado(s) serão ignorados.</small>` : ''}`, {ok:'Lançar', titulo:'Confirmar'})) return;
    db.diarias.push(...novos); salvar(); toast(`✅ ${novos.length} diária(s) lançada(s).`, 'ok'); atualizar();
  },
  pagSimples: fm => {
    const E = fm.elements, fid = E.fid.value;
    if (!func(fid)) return erroForm(fm, 'Escolha o trabalhador.');
    const s0 = saldoFunc(fid).saldo;
    const valor = parseValor(E.valor.value);
    const tipo = E.modo.value === 'vale' ? 'adiantamento' : (Math.abs(valor - s0) < 0.005 ? 'integral' : 'parcial');
    if (!validarPagamento(fm, {fid, tipo, data:E.data.value, valor, obraId:''})) return;
    const f = func(fid);
    db.pagamentos.push({id:uid(), data:E.data.value, funcionarioId:fid, obraId:'', tipo, valor, obs:E.obs.value.trim(), nomeFunc:f.nome, criadoEm:new Date().toISOString()});
    salvar(); fecharModal(true);
    toast(`✅ ${tipo === 'adiantamento' ? 'Vale' : 'Pagamento'} de ${fmt(valor)} registrado.`, 'ok'); atualizar();
  },
  editPag: fm => {
    const E = fm.elements, p = db.pagamentos.find(x => x.id === E.id.value); if (!p) return fecharModal();
    const dados = {fid:p.funcionarioId, tipo:E.tipo.value, data:E.data.value, valor:parseValor(E.valor.value), obraId:E.obra.value, excluir:p.id};
    if (!validarPagamento(fm, dados)) return;
    Object.assign(p, {tipo:dados.tipo, data:dados.data, valor:dados.valor, obraId:dados.obraId, obs:E.obs.value.trim()});
    salvar(); fecharModal(true); toast('Pagamento atualizado.', 'ok'); atualizar();
  }
};

/* ================== EVENTOS ================== */
document.addEventListener('click', e => {
  const m = e.target.closest('[data-m]');
  if (m){ fecharModal(m.dataset.m === 'sim'); return; }
  if (e.target.id === 'modal'){ fecharModal(false); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav){ e.preventDefault(); fecharModal(false); ir(nav.dataset.nav); return; }
  const a = e.target.closest('[data-act]');
  if (a && acoes[a.dataset.act]){ e.preventDefault(); acoes[a.dataset.act](a); }
});
document.addEventListener('submit', e => {
  const h = forms[e.target.dataset.form];
  if (h){ e.preventDefault(); h(e.target); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filtro){ const f = st[t.dataset.filtro]; f[t.dataset.campo] = t.value; if (t.dataset.campo === 'de' || t.dataset.campo === 'ate'){ if (f.periodo !== 'personalizado'){ f.de = f.de && t.dataset.campo === 'de' ? f.de : (t.dataset.campo === 'de' ? t.value : ''); f.ate = t.dataset.campo === 'ate' ? t.value : ''; } f.periodo = 'personalizado'; } atualizar(); return; }
  if (t.dataset.hist){ st.histD[t.dataset.hist] = t.value; st.histD.limite = 60; renderHistDiarias(); return; }
  if (t.id === 'l-data'){ if (dataValida(t.value) && t.value <= hoje()){ st.lanc.data = t.value; st.lanc.marks = {}; } else toast('Escolha uma data até hoje.', 'erro'); renderDiarias(); return; }
  if (t.id === 'f-inativos'){ st.fInativos = t.checked; renderListaFunc(); return; }
  if (t.id === 'o-arq'){ st.oArq = t.checked; renderObras(); return; }
  if (t.id === 'f-inativos2'){ return; }
  if (t.hasAttribute('data-trocar-pag')){ const v = $('#modal-box [name=valor]')?.value; formPagar(t.value, !!t.dataset.trocarPag); const i = $('#modal-box [name=valor]'); if (i && v) i.value = v; return; }
  if (t.name === 'quem' && t.closest('form[data-form=gasto]')){ atualizarInfoGasto(); return; }
  if (t.id === 'hp-func'){ st.histP.func = t.value; st.histP.limite = 60; renderHistPag(); return; }
  if (t.hasAttribute('data-toggle-custom')){ $('.custom-wrap', t.form).classList.toggle('hidden', t.value !== 'personalizado'); return; }
  if (t.id === 'arquivo-import' && t.files[0]) importarArquivo(t.files[0]);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-busca'){ st.fBusca = t.value; renderListaFunc(); return; }
  if (t.dataset.mask === 'tel'){ t.value = mascaraTel(t.value); }
  if (t.name === 'valor' && t.closest('form[data-form=gasto]')) atualizarInfoGasto();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('open')) fecharModal(false); });
window.addEventListener('resize', () => { if (st.view === 'dashboard'){ clearTimeout(window._rz); window._rz = setTimeout(() => { const {fx, ds} = filtrarDados(st.dash); desenharLinha($('#graf-dias'), ds, fx); }, 200); } });

function importarArquivo(file){
  if (file.size > 20 * 1024 * 1024) return toast('Arquivo muito grande.', 'erro');
  const leitor = new FileReader();
  leitor.onload = async () => {
    let dados;
    try { dados = JSON.parse(leitor.result); } catch(e){ return toast('Arquivo inválido: não é um JSON.', 'erro'); }
    const v = validar(dados);
    if (!v.ok) return toast('Backup inválido: ' + v.erro, 'erro');
    if (!await confirmar(`Backup válido com <b>${dados.funcionarios.length}</b> funcionário(s), <b>${dados.obras.length}</b> obra(s), <b>${dados.diarias.length}</b> diária(s) e <b>${dados.pagamentos.length}</b> pagamento(s).<br><br>Substituir <b>todos</b> os dados atuais por este backup?`, {ok:'Importar', perigo:true})) return;
    db = normalizar(dados); db.config.avisoVisto = true; salvar(); toast('✅ Backup importado com sucesso.', 'ok'); ir('inicio');
  };
  leitor.onerror = () => toast('Não foi possível ler o arquivo.', 'erro');
  leitor.readAsText(file, 'utf-8');
}

/* ================== INÍCIO ================== */
ir((location.hash || '').slice(1) || 'inicio');
</script>
